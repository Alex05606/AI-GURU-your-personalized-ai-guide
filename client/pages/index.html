<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Guru - Virtual Friend</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}

/* Background */

.bg-main-gradient{
background:radial-gradient(circle at top right,#3b2b63,#1a1a2e);
background-attachment:fixed;
}

/* Glass UI */

.glass-card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
}

/* Floating Avatar */

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0px);}
}

.animate-float{
animation:float 4s ease-in-out infinite;
}

/* Voice Wave */

.sound-wave{
position:absolute;
display:flex;
gap:4px;
align-items:center;
opacity:0;
}

.left-wave{left:-70px;}
.right-wave{right:-70px;}

.sound-wave div{
width:4px;
height:12px;
background:#60a5fa;
border-radius:3px;
animation:wave 1s infinite ease-in-out;
}

.sound-wave div:nth-child(2){animation-delay:0.1s;}
.sound-wave div:nth-child(3){animation-delay:0.2s;}
.sound-wave div:nth-child(4){animation-delay:0.3s;}
.sound-wave div:nth-child(5){animation-delay:0.4s;}

@keyframes wave{
0%{height:10px;}
50%{height:40px;}
100%{height:10px;}
}

.wave-active{
opacity:1;
}

/* Chat History Items */

.history-item{
padding:10px;
border-radius:10px;
background:rgba(255,255,255,0.05);
cursor:pointer;
transition:0.2s;
}

.history-item:hover{
background:rgba(255,255,255,0.15);
}

</style>

</head>

<body class="bg-main-gradient text-white h-screen flex">

<!-- LEFT SIDEBAR -->

<div class="w-64 p-4 border-r border-white/10 bg-black/30">

<h2 class="text-lg font-semibold mb-4">Chat History</h2>

<div id="history-list" class="space-y-2">

<!-- Chat history items will appear here -->

</div>

</div>


<!-- RIGHT MAIN CHAT AREA -->

<div class="flex-1 flex flex-col items-center justify-between">

<header class="p-6 flex justify-between items-center w-full">

<div class="flex items-center space-x-2">
<div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
<span class="text-sm font-medium tracking-wide opacity-80 uppercase">
AI Guru Online
</span>
</div>

</header>


<!-- Avatar Section -->

<div class="flex flex-col items-center">

<div class="relative w-60 aspect-square flex items-center justify-center animate-float">

<div id="wave-left" class="sound-wave left-wave">
<div></div><div></div><div></div><div></div><div></div>
</div>

<img
class="w-full h-full object-contain rounded-full border-4 border-white/20 shadow-2xl"
src="https://lh3.googleusercontent.com/aida-public/AB6AXuClA1pfGkuCmMaMxdMhkOH8KCkHz4DPqutfSO-Kd5LjcQc9324y8HcB76YoV_vAQOSaFmeCVsSAtmqcYg7ya7ltArMh4K9J1buJ3Il3lXZ9PWiiOeDeJsk-nqpL14eMR2tWxPmv_AuQRdPCFsw8eUrF-QakX4Um7u6YxEu0dNcP2X-l7mkPx3W4tM1VkKwv-pebyrVIvBHtdObzo8eZCEqkSiXU7EHOAah08odf1n9cZXSUmQcThTMfDKc72OmdulLKe7V3JvT7t-Y5"
/>

<div id="wave-right" class="sound-wave right-wave">
<div></div><div></div><div></div><div></div><div></div>
</div>

</div>

<!-- CHAT MESSAGES -->

<div id="chat-container"
class="glass-card p-6 rounded-3xl shadow-xl relative max-h-[300px] overflow-y-auto mt-6 w-[600px]">

<p class="text-blue-50">
Hi! I am your AI Guru. I am here to help you solve your problems.
</p>

</div>

</div>


<!-- INPUT AREA -->

<footer class="p-6 w-full flex justify-center">

<div class="w-[600px] flex items-center glass-card rounded-2xl p-2 gap-2">

<button id="voice-btn" class="p-3 text-blue-300 hover:text-white">

🎤

</button>

<button id="upload-btn" class="p-3 text-blue-300 hover:text-white">

📤

</button>

<input type="file" id="file-input" hidden>

<input
id="chat-input"
placeholder="Ask me anything..."
class="flex-grow bg-transparent border-none focus:ring-0 text-white placeholder-white/40 py-3 px-2"
/>

<button
id="send-btn"
class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl">

➤

</button>

</div>

</footer>

</div>

<script src="../js/chat.js"></script>

</body>
</html>
